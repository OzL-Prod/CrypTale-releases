name: 💡 Feature request
description: An idea to make CrypTale better
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see in the mod?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What would it bring to the players or to the server admins?
 
